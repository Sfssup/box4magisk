name: prerelease

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".github"
      - "README.md"
    tags-ignore:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Update module version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="$(sed -n 's/^version=//p' module.prop | head -n 1)"

          if [ -z "$VERSION" ]; then
            echo "Error: version field not found in module.prop"
            exit 1
          fi

          sed -i "s/^version=.*/version=${VERSION}_${SHORT_SHA}/" module.prop

          echo "Module version: ${VERSION}-${SHORT_SHA}"
          echo "Build filename: box4_${SHORT_SHA}.zip"

      - name: Run build.sh
        run: sh build.sh

      - name: Rename build artifact
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          FOUND=0

          for file in box4_v*.zip; do
            [ -f "$file" ] || continue
            mv "$file" "box4_${SHORT_SHA}.zip"
            FOUND=1
            break
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "Error: build ZIP not found"
            exit 1
          fi

      - name: Delete current prerelease assets
        uses: andreaswilli/delete-release-assets-action@v3.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease
          deleteOnlyFromDrafts: false

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: Prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Prerelease
        uses: softprops/action-gh-release@v1
        if: ${{ success() }}
        with:
          tag: Prerelease
          tag_name: Prerelease
          files: box4_*.zip
          prerelease: true
          generate_release_notes: true
