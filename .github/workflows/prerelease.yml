
name: prerelease

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".github"
      - "README.md"
    tags-ignore:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Update module version
        run: |
          set -e

          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"

          if ! grep -q '^version=' module.prop; then
            echo "Error: version field not found in module.prop"
            exit 1
          fi

          if ! grep -q '^versionCode=' module.prop; then
            echo "Error: versionCode field not found in module.prop"
            exit 1
          fi

          sed -i "s/^version=.*/version=${SHORT_SHA}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${BUILD_DATE}/" module.prop

          echo "Module version: ${SHORT_SHA}"
          echo "Module versionCode: ${BUILD_DATE}"

          cat module.prop

      - name: Run build.sh
        run: |
          sh build.sh

      - name: Rename build artifact
        shell: bash
        run: |
          set -e

          SHORT_SHA="${GITHUB_SHA::7}"
          TARGET="box4_${SHORT_SHA}.zip"
          FOUND=0

          echo "Searching build ZIP files..."

          for file in *.zip; do
            [ -f "$file" ] || continue

            if [ "$file" = "$TARGET" ]; then
              echo "Target ZIP already exists: $TARGET"
              FOUND=1
              break
            fi

            if [ "$FOUND" -eq 1 ]; then
              echo "Error: Multiple ZIP files found"
              exit 1
            fi

            SOURCE="$file"
            FOUND=1
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "Error: Build ZIP not found"
            ls -lah
            exit 1
          fi

          if [ -n "${SOURCE:-}" ]; then
            mv "$SOURCE" "$TARGET"
          fi

          echo "Build artifact: $TARGET"
          ls -lh "$TARGET"

      - name: Delete current prerelease assets
        uses: andreaswilli/delete-release-assets-action@v3.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease
          deleteOnlyFromDrafts: false

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: Prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Prerelease
        uses: softprops/action-gh-release@v1
        if: ${{ success() }}
        with:
          tag: Prerelease
          tag_name: Prerelease
          files: box4_*.zip
          prerelease: true
          generate_release_notes: true
